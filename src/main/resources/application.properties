spring.application.name=pdks-backend
server.port=9999


spring.datasource.url=jdbc:postgresql://localhost:5432/pdks
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.fromName=Proven PDKS
spring.mail.fromAddress=pkds@proven.com.tr
spring.mail.username=
spring.mail.password=
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.mime.charset=UTF

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html